  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f5f4f1;color:#1a1a1a;font-size:13px;display:flex;flex-direction:column}

    /* FIXED HEADER */
    #fixed-header{position:fixed;top:0;left:0;right:0;z-index:1000}

    /* NAV */
    nav{background:#111;display:flex;gap:0;border-bottom:1px solid #333}
    nav a{color:#ccc;text-decoration:none;padding:.75rem 1.5rem;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;transition:background .15s,color .15s}
    nav a:hover,nav a.active{background:#fff;color:#111}

    /* SUBHEADER */
    .subhdr{background:#1a1a1a;color:#fff;padding:.8rem 1.5rem;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;border-bottom:1px solid #333}
    .subhdr h1{font-size:.95rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
    .subhdr p{font-size:.75rem;color:#888}

    /* LOADING */
    #loading-screen{position:fixed;inset:0;background:#1a1a1a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;color:#fff}
    #loading-screen h2{font-size:1rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#888}
    .spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#C9A84C;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* CONTROLS BAR */
    .map-controls{background:#fff;border-bottom:1px solid #e5e5e5;padding:.6rem 1.5rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
    .zone-btn{border:2px solid transparent;border-radius:20px;padding:.3rem .85rem;font-size:.75rem;font-weight:700;cursor:pointer;background:#f5f5f5;color:#555;transition:all .15s}
    .zone-btn:hover{border-color:#1a1a1a}
    .zone-btn.active-all{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
    .zone-btn.active-lyon{background:#dbeafe;color:#1d4ed8;border-color:#1d4ed8}
    .zone-btn.active-alpes{background:#dcfce7;color:#15803d;border-color:#15803d}
    .zone-btn.active-sud{background:#ffedd5;color:#c2670a;border-color:#c2670a}
    .zone-btn.active-autres{background:#f3e8ff;color:#7c3aed;border-color:#7c3aed}
    #map-search{border:1px solid #ddd;border-radius:6px;padding:.4rem .7rem;font-size:.8rem;width:200px}
    #map-search:focus{outline:none;border-color:#1a1a1a}
    #ag-count{font-size:.75rem;color:#888;margin-left:auto}

    /* MAP */
    #map-area{position:fixed;left:0;right:0;bottom:0}

    /* LEGEND */
    .map-legend{background:#fff;border-radius:8px;padding:.75rem 1rem;font-size:.72rem;line-height:1.9;box-shadow:0 2px 8px rgba(0,0,0,.12)}
    .map-legend b{display:block;margin-bottom:.3rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:#555}
    .leg-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:.4rem;vertical-align:middle}

    /* POPUP */
    .leaflet-popup-content-wrapper{border-radius:10px !important;box-shadow:0 4px 16px rgba(0,0,0,.15) !important}
    .leaflet-popup-content{margin:10px 14px !important;font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;line-height:1.6}
    .popup-name{font-weight:700;font-size:.88rem;margin-bottom:.35rem;color:#1a1a1a}
    .popup-badge{font-size:.62rem;font-weight:700;padding:.15rem .4rem;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;display:inline-block;margin-bottom:.4rem}
    .popup-row{color:#555;margin:.1rem 0}
    .popup-row a{color:#1d4ed8;text-decoration:none}
    .popup-row a.mail{color:#7c3aed}
    .popup-row a:hover{text-decoration:underline}
    .popup-status{display:inline-block;border-radius:5px;padding:.2rem .5rem;font-size:.72rem;font-weight:600;margin-top:.35rem}

    /* MOBILE */
    @media(max-width:700px){
      nav a{padding:.55rem .9rem;font-size:.72rem}
      .subhdr{padding:.6rem .75rem}
      .subhdr p{display:none}
      .map-controls{padding:.45rem .75rem;gap:.4rem}
      #map-search{width:130px}
    }
  </style>
</head>

// ═══════════════════════════════════════════════════
// ZONE COLORS
// ═══════════════════════════════════════════════════
const ZONE_COLORS = {
  Lyon:   '#2563eb',
  Alpes:  '#16a34a',
  Sud:    '#ea580c',
  Autres: '#7c3aed',
};
const ZONE_BADGE_CSS = {
  Lyon:   'background:#dbeafe;color:#1d4ed8',
  Alpes:  'background:#dcfce7;color:#15803d',
  Sud:    'background:#ffedd5;color:#c2670a',
  Autres: 'background:#f3e8ff;color:#7c3aed',
};

// ═══════════════════════════════════════════════════
// MAP + MARKERS
// ═══════════════════════════════════════════════════
let map, allMarkers = [], firestoreData = {};
let activeZone = 'all', activeSearch = '';

function getCoords(ag) {
  const c = CITY_COORDS[ag.city];
  if (c) return c;
  // Fallback par zone
  if (ag.zone === 'Lyon')   return [45.7640 + Math.random()*0.05-0.025, 4.8357 + Math.random()*0.05-0.025];
  if (ag.zone === 'Alpes')  return [45.70   + Math.random()*0.5-0.25,   6.50   + Math.random()*0.5-0.25];
  if (ag.zone === 'Sud')    return [43.50   + Math.random()*0.5-0.25,   6.50   + Math.random()*0.5-0.25];
  return [46.0 + Math.random()*2-1, 4.0 + Math.random()*2-1];
}

function makeIcon(zone, status) {
  const color = ZONE_COLORS[zone] || '#888';
  const sColor = ST_COLORS[status] || '#9ca3af';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
    <path d="M13 0C5.82 0 0 5.82 0 13c0 9 13 21 13 21s13-12 13-21C26 5.82 20.18 0 13 0z" fill="${color}" stroke="#fff" stroke-width="2"/>
    <circle cx="13" cy="13" r="5" fill="${sColor}" stroke="#fff" stroke-width="1.5"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [26, 34],
    iconAnchor: [13, 34],
    popupAnchor: [0, -34],
  });
}

function popupHtml(ag) {
  const d = firestoreData[ag.id] || {};
  const status = d.status || 'nc';
  const st = STATUSES[status] || STATUSES['nc'];
  const badgeCss = ZONE_BADGE_CSS[ag.zone] || '';
  const phoneLink = ag.phone ? `<div class="popup-row">📞 <a href="tel:${ag.phone}">${ag.phone}</a></div>` : '';
  const mailLink  = ag.email ? `<div class="popup-row">✉ <a href="mailto:${ag.email}" class="mail">${ag.email}</a></div>` : '';
  const siteLink  = ag.site  ? `<div class="popup-row">🌐 <a href="https://${ag.site}" target="_blank">${ag.site}</a></div>` : '';
  const noteHtml  = d.notes  ? `<div class="popup-row" style="color:#666;font-style:italic;margin-top:.4rem">${d.notes}</div>` : '';
  const statusHtml = `<span class="popup-status" style="background:${ST_COLORS[status]}22;color:${ST_COLORS[status]}">${st.label}</span>`;
  return `
    <div class="popup-name">${ag.name}</div>
    <span class="popup-badge" style="${badgeCss}">${ag.zone}</span>
    <div class="popup-row" style="color:#888">${ag.city}</div>
    ${phoneLink}${mailLink}${siteLink}${noteHtml}
    ${statusHtml}
  `;
}

function buildMarkers() {
  allMarkers.forEach(m => m.marker.remove());
  allMarkers = [];

  // Compteur pour décaler les markers sur la même ville
  const cityCount = {};

  AGENCIES.forEach(ag => {
    const coords = getCoords(ag);
    const key = coords.join(',');
    cityCount[key] = (cityCount[key] || 0) + 1;
    const n = cityCount[key];
    // Offset spiral pour éviter l'empilement
    const angle = n * 2.4;
    const r = n > 1 ? (n * 0.0018) : 0;
    const lat = coords[0] + r * Math.cos(angle);
    const lng = coords[1] + r * Math.sin(angle);

    const d = firestoreData[ag.id] || {};
    const status = d.status || 'nc';
    const marker = L.marker([lat, lng], {icon: makeIcon(ag.zone, status)});
    marker.bindPopup(popupHtml(ag), {maxWidth: 280});
    allMarkers.push({marker, ag, lat, lng});
  });

  applyFilters();
}

function applyFilters() {
  let visible = 0;
  allMarkers.forEach(({marker, ag}) => {
    const matchZone   = activeZone === 'all' || ag.zone === activeZone;
    const matchSearch = !activeSearch
      || ag.name.toLowerCase().includes(activeSearch)
      || ag.city.toLowerCase().includes(activeSearch);
    if (matchZone && matchSearch) {
      marker.addTo(map);
      visible++;
    } else {
      marker.remove();
    }
  });
  document.getElementById('ag-count').textContent = `${visible} agence${visible>1?'s':''} affichée${visible>1?'s':''}`;
}

function filterZone(zone, btn) {
  activeZone = zone;
  document.querySelectorAll('.zone-btn').forEach(b => {
    b.className = 'zone-btn';
    if (b === btn) {
      if (zone==='all')    b.classList.add('active-all');
      else if (zone==='Lyon')   b.classList.add('active-lyon');
      else if (zone==='Alpes')  b.classList.add('active-alpes');
      else if (zone==='Sud')    b.classList.add('active-sud');
      else b.classList.add('active-autres');
    }
  });
  applyFilters();
  // Centrer la carte sur la zone
  const CENTERS = {
    Lyon:   {latlng:[45.77, 4.85], zoom:12},
    Alpes:  {latlng:[45.75, 6.55], zoom:9},
    Sud:    {latlng:[43.50, 6.80], zoom:9},
    Autres: {latlng:[46.00, 4.00], zoom:5},
    all:    {latlng:[45.50, 5.50], zoom:7},
  };
  const c = CENTERS[zone] || CENTERS.all;
  map.flyTo(c.latlng, c.zoom, {duration:1.2});
}

function filterSearch(val) {
  activeSearch = val.toLowerCase().trim();
  applyFilters();
}

// ═══════════════════════════════════════════════════
// LAYOUT
// ═══════════════════════════════════════════════════
function adjustLayout() {
  const h = document.getElementById('fixed-header').offsetHeight;
  const mapEl = document.getElementById('map-area');
  mapEl.style.top = h + 'px';
  if (map) map.invalidateSize();
}
window.addEventListener('resize', adjustLayout);

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
async function init() {
  // Layout
  adjustLayout();
  const h = document.getElementById('fixed-header').offsetHeight;
  document.getElementById('map-area').style.top = h + 'px';

  // Init Leaflet
  map = L.map('map-area', {zoomControl: true}).setView([45.5, 5.8], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18,
  }).addTo(map);

  // Légende
  const legend = L.control({position:'bottomright'});
  legend.onAdd = function() {
    const div = L.DomUtil.create('div','map-legend');
    div.innerHTML = `<b>Zones</b>
      <div><span class="leg-dot" style="background:#2563eb"></span>Lyon</div>
      <div><span class="leg-dot" style="background:#16a34a"></span>Alpes</div>
      <div><span class="leg-dot" style="background:#ea580c"></span>Sud</div>
      <div><span class="leg-dot" style="background:#7c3aed"></span>Autres</div>
      <b style="margin-top:.5rem;display:block">Statut (centre)</b>
      <div><span class="leg-dot" style="background:#9ca3af"></span>Non contacté</div>
      <div><span class="leg-dot" style="background:#3b82f6"></span>Email envoyé</div>
      <div><span class="leg-dot" style="background:#f59e0b"></span>Relance 1</div>
      <div><span class="leg-dot" style="background:#10b981"></span>Stage obtenu ✓</div>`;
    return div;
  };
  legend.addTo(map);

  // Charger statuts Firestore
  try {
    const snap = await db.collection('prospection').get();
    snap.forEach(doc => { firestoreData[doc.id] = doc.data(); });
  } catch(e) { console.warn('Firebase indisponible:', e); }

  // Masquer loading + construire markers
  document.getElementById('loading-screen').style.display = 'none';
  buildMarkers();
  adjustLayout();
}

init();
</script>
